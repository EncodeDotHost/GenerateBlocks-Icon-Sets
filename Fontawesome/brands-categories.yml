# Hand-curated categories for the Font Awesome Free brand icons that
# metadata/categories.yml does not place in any category.
#
# Keys are Font Awesome category labels (plus "Other"). Values are icon
# names from metadata/icons.json. An icon may appear under several labels.
# The first draft came from the icon search terms; every entry was then
# reviewed by hand. Edit this file and rerun build_fontawesome.py to move icons.
# Icons that categories.yml already places are merged in by the script.

